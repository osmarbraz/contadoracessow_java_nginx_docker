# ============================================================
# BLOCO DE EVENTOS
# ============================================================
# Define as configurações relacionadas ao processamento de
# conexões e eventos pelo Nginx.
events {
}

# ============================================================
# BLOCO HTTP
# ============================================================
# Define as configurações do servidor HTTP e dos recursos
# utilizados para atender às requisições Web.
http {

    # ========================================================
    # BALANCEAMENTO DE CARGA
    # ========================================================
    # Define um grupo de servidores que receberá as requisições
    # encaminhadas pelo Nginx.
    #
    # O nome "app" será utilizado posteriormente pelo
    # proxy_pass para encaminhar as requisições para este grupo.
    upstream app {

        # ----------------------------------------------------
        # AFINIDADE DE SESSÃO POR IP
        # ----------------------------------------------------
        # Mantém as requisições de um mesmo cliente direcionadas
        # sempre para o mesmo servidor de aplicação, com base
        # no endereço IP do cliente. Está desabilitada.
        # ip_hash;

        # ----------------------------------------------------
        # SERVIDOR DE APLICAÇÃO
        # ----------------------------------------------------
        # Define o serviço "app" como servidor de destino.
        #
        # "app" corresponde ao nome do serviço definido no
        # arquivo docker-compose.yml.
        #
        # A porta 8080 corresponde à porta em que a aplicação
        # Java/Tomcat está executando dentro do container.
        server app:8080;
    }

    # ========================================================
    # SERVIDOR WEB
    # ========================================================
    # Define o servidor HTTP que receberá as requisições dos
    # clientes.
    server {
        # ----------------------------------------------------
        # PORTA DE ESCUTA
        # ----------------------------------------------------
        # Faz o Nginx aceitar requisições HTTP na porta 80.
        listen 80;

        # ----------------------------------------------------
        # ROTEAMENTO DAS REQUISIÇÕES
        # ----------------------------------------------------
        # Define as regras para as requisições recebidas no
        # caminho raiz "/" e em seus respectivos recursos.
        location / {

            # Encaminha as requisições recebidas para o grupo
            # de servidores definido no bloco "upstream app".
            #
            # O Nginx atua como proxy reverso e, quando existem
            # múltiplas réplicas do serviço "app", distribui as
            # requisições entre elas.
            proxy_pass http://app;
        }
    }
}